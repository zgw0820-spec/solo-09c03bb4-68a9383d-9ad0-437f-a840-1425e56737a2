services:
  migrate:
    build:
      context: .
    image: gpt-512e-to-4kn:latest
    container_name: gpt-512e-to-4kn
    ports:
      - "${MIGRATE_PORT:-8000}:8000"
    environment:
      MIGRATE_MAX_UPLOAD_BYTES: "${MIGRATE_MAX_UPLOAD_BYTES:-8589934592}"
      MIGRATE_JOB_TTL_SECONDS: "${MIGRATE_JOB_TTL_SECONDS:-3600}"
      MIGRATE_COPY_CHUNK_BYTES: "${MIGRATE_COPY_CHUNK_BYTES:-4194304}"
      MIGRATE_MAX_CONCURRENT_JOBS: "${MIGRATE_MAX_CONCURRENT_JOBS:-1}"
    volumes:
      - jobs:/data/jobs
    # The image runs as an unprivileged user and needs no kernel capabilities:
    # it only reads uploaded bytes and writes files under /data/jobs.
    read_only: true
    tmpfs:
      # Only small transient files (atomic job.json writes) live here.  The
      # browser sends a raw streaming body, so multipart spooling is unused.
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  jobs:
